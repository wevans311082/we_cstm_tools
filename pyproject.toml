[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "va-workspace"
version = "0.2.0"
description = "Kali operator toolkit that turns Nmap reconnaissance into a CHECK-shaped Obsidian vault."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wayne Evans" }]
keywords = ["kali", "nmap", "obsidian", "check", "ithc", "vulnerability-assessment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.15,<0.20",
  "rich~=13.9.4",
  "jinja2~=3.1.4",
  "pyyaml~=6.0.2",
  "matplotlib~=3.9.2",
]

[project.optional-dependencies]
dev = [
  "pytest~=8.3.3",
  "ruff~=0.6.9",
  "mypy~=1.11.2",
  "types-PyYAML~=6.0.12",
]

[project.scripts]
va = "va_workspace.cli:app"

[project.urls]
Homepage = "https://github.com/wevans311082/we_cstm_tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
va_workspace = [
  "py.typed",
  "config/*.yaml",
  "templates/*.j2",
  "templates/report/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "kali: requires Kali Linux binaries",
  "requires_nmap: requires nmap installed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/va_workspace/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["va_workspace"]