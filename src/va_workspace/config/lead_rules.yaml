# Auto-leads from NSE output. Never become findings until the operator promotes them.
rules:
  - id: va-hsts
    script: va-http-posture
    pattern: "(?i)hsts: missing"
    title: "Missing HTTP security headers"
    template: missing-hsts
  - id: va-cookies
    script: va-http-posture
    pattern: "(?i)missing-httponly|missing-secure"
    title: "Cookie security flags"
    template: cookie-flags
  - id: va-trace
    script: va-http-posture
    pattern: "(?i)trace: enabled"
    title: "HTTP TRACE enabled"
    template: http-trace
  - id: va-methods
    script: va-http-posture
    pattern: "(?i)dangerous_methods: yes"
    title: "Dangerous HTTP methods"
    template: http-methods
  - id: va-git
    script: va-git-exposed
    pattern: "(?i)\\.git|actuator|phpinfo|manager"
    title: "Sensitive HTTP path exposed"
    template: git-exposed
  - id: va-expired-cert
    script: va-tls-posture
    pattern: "(?i)expired: yes"
    title: "Expired TLS certificate"
    template: expired-cert
  - id: va-weak-key
    script: va-tls-posture
    pattern: "(?i)weak_key: yes"
    title: "Weak TLS key"
    template: expired-cert
  - id: va-smb-anon
    script: va-smb-posture
    pattern: "(?i)anonymous_shares: .+"
    title: "Unauthenticated SMB shares"
    template: smb-null
  - id: va-ssh-weak
    script: va-ssh-posture
    pattern: "(?i)weak_algorithms: .+"
    title: "Weak SSH algorithms"
    template: ssh-weak
  - id: va-ftp
    script: va-ftp-anon
    pattern: "(?i)anonymous: allowed"
    title: "Anonymous FTP"
    template: ftp-anon
  - id: va-snmp
    script: va-snmp-public
    pattern: "(?i)public: yes"
    title: "SNMP community public"
    template: snmp-public
  - id: va-redirect
    script: va-redirect-scope
    pattern: "(?i)off_host: yes"
    title: "HTTP redirect off-host"
    template: internal-ip
  - id: va-rdp
    script: va-rdp-posture
    pattern: "(?i)exposed: yes"
    title: "RDP exposed"
    template: rdp-exposed
  - id: va-redis
    script: va-db-unauth
    pattern: "(?i)unauth: yes"
    title: "Data store without authentication"
    template: redis-unauth
  - id: va-default-page
    script: va-http-default-page
    pattern: "(?i)default_page: yes"
    title: "Default HTTP page / management UI"
    template: missing-hsts
  - id: va-cors
    script: va-http-cors
    pattern: "(?i)cors: (wildcard|reflects-origin)"
    title: "Permissive CORS"
    template: cors-wildcard
  - id: va-robots
    script: va-http-robots
    pattern: "(?i)interesting: .+\\S"
    title: "robots.txt interesting paths"
    template: git-exposed
  - id: va-dav
    script: va-http-dav
    pattern: "(?i)webdav: yes"
    title: "WebDAV enabled"
    template: webdav
  - id: va-vhosts
    script: va-http-vhosts
    pattern: "(?i)vhosts: (?!none).+"
    title: "Additional HTTP virtual hosts"
    template: internal-ip
  - id: va-admin
    script: va-http-admin-paths
    pattern: "(?i)admin_paths: yes"
    title: "HTTP management path"
    template: git-exposed
  - id: va-backup
    script: va-http-backup
    pattern: "(?i)found: yes"
    title: "Web backup/config file"
    template: git-exposed
  - id: va-winrm
    script: va-winrm-posture
    pattern: "(?i)exposed: yes"
    title: "WinRM exposed"
    template: winrm-exposed
  - id: va-vnc
    script: va-vnc-posture
    pattern: "(?i)(vnc: yes|none_auth: yes)"
    title: "VNC exposed"
    template: vnc-exposed
  - id: va-telnet
    script: va-telnet-posture
    pattern: "(?i)cleartext: yes"
    title: "Telnet cleartext"
    template: telnet-clear
  - id: va-dns-rec
    script: va-dns-recursion
    pattern: "(?i)recursion: yes"
    title: "Open DNS resolver"
    template: open-resolver
  - id: va-axfr
    script: va-dns-axfr
    pattern: "(?i)axfr: yes"
    title: "DNS zone transfer"
    template: axfr
  - id: va-rsync
    script: va-rsync-modules
    pattern: "(?i)listed: yes"
    title: "Rsync modules listed"
    template: rsync-open
  - id: va-x11
    script: va-x11-open
    pattern: "(?i)x11: open"
    title: "X11 open"
    template: x11-open
  - id: va-docker
    script: va-docker-api
    pattern: "(?i)unauth: yes"
    title: "Unauthenticated Docker API"
    template: docker-api
  - id: va-kube
    script: va-kubelet-anon
    pattern: "(?i)unauth: yes"
    title: "Unauthenticated kubelet"
    template: kubelet-anon
  - id: va-mysql
    script: va-mysql-empty
    pattern: "(?i)empty_root: yes"
    title: "MySQL empty root password"
    template: mysql-blank
  - id: va-mongo
    script: va-mongodb-unauth
    pattern: "(?i)unauth: yes"
    title: "MongoDB unauthenticated"
    template: mongo-unauth
  - id: va-smi
    script: va-cisco-smi
    pattern: "(?i)smart_install: open"
    title: "Cisco Smart Install"
    template: cisco-smart-install
  - id: va-mqtt
    script: va-mqtt-unauth
    pattern: "(?i)unauth: yes"
    title: "MQTT unauthenticated"
    template: mqtt-unauth
  - id: va-jdwp
    script: va-jdwp-open
    pattern: "(?i)jdwp: yes"
    title: "Java Debug Wire Protocol open"
    template: jdwp-open
  - id: va-owa
    script: va-owa-paths
    pattern: "(?i)exchange: yes"
    title: "Exchange/OWA exposed"
    template: owa-exposed
  - id: va-wp
    script: va-wordpress
    pattern: "(?i)wordpress: yes"
    title: "WordPress detected"
    template: wordpress
  - id: va-ipmi
    script: va-ipmi-cipher0
    pattern: "(?i)ipmi: open"
    title: "IPMI exposed"
    template: ipmi-cipher-zero
  - id: ftp-anon
    script: ftp-anon
    pattern: "(?i)anonymous"
    title: "Anonymous FTP"
    template: ftp-anon
  - id: http-trace
    script: http-trace
    pattern: "(?i)TRACE"
    title: "HTTP TRACE enabled"
    template: http-trace
  - id: http-methods
    script: http-methods
    pattern: "(?i)\\b(PUT|DELETE|CONNECT|TRACE)\\b"
    title: "Dangerous HTTP methods"
    template: http-methods
  - id: http-security-headers
    script: http-security-headers
    pattern: "(?i)(missing|not present|strict-transport-security)"
    title: "Missing HTTP security headers"
    template: missing-hsts
  - id: http-cookie-flags
    script: http-cookie-flags
    pattern: "(?i)(missing|httponly|secure)"
    title: "Cookie security flags"
    template: cookie-flags
  - id: http-internal-ip
    script: http-internal-ip-disclosure
    pattern: "."
    title: "Internal IP disclosed in HTTP"
    template: internal-ip
  - id: http-git
    script: http-git
    pattern: "(?i)git"
    title: "Git metadata exposed"
    template: git-exposed
  - id: http-webdav
    script: http-webdav-scan
    pattern: "(?i)(webdav|enabled|PROPFIND)"
    title: "WebDAV enabled"
    template: webdav
  - id: ssl-weak
    script: ssl-enum-ciphers
    pattern: "(?i)(SSLv2|SSLv3|TLSv1\\.0|TLSv1\\.0\\b|RC4|DES|3DES|NULL|EXPORT|broken|weak)"
    title: "Weak TLS configuration"
    template: weak-ciphers
  - id: ssl-heartbleed
    script: ssl-heartbleed
    pattern: "(?i)VULNERABLE"
    title: "Heartbleed (unverified)"
    template: heartbleed
  - id: ssl-poodle
    script: ssl-poodle
    pattern: "(?i)VULNERABLE"
    title: "POODLE (unverified)"
    template: tls10
  - id: ssl-cert-intaddr
    script: ssl-cert-intaddr
    pattern: "."
    title: "Internal names in certificate"
    template: expired-cert
  - id: smb-signing
    script: smb-security-mode
    pattern: "(?i)(disabled|not required|message signing enabled but not required)"
    title: "SMB signing not required"
    template: smb-signing
  - id: smb2-signing
    script: smb2-security-mode
    pattern: "(?i)(disabled|not required|message signing enabled but not required)"
    title: "SMBv2 signing not required"
    template: smb-signing
  - id: smbv1
    script: smb-protocols
    pattern: "(?i)(NT LM 0\\.12|SMBv1|dialect 2\\.0\\.2)"
    title: "SMBv1 offered"
    template: smbv1
  - id: smb-shares
    script: smb-enum-shares
    pattern: "(?i)(Anonymous|Guest|access: READ)"
    title: "Unauthenticated SMB shares"
    template: smb-null
  - id: ms17-010
    script: smb-vuln-ms17-010
    pattern: "(?i)VULNERABLE"
    title: "MS17-010 EternalBlue (unverified)"
    template: ms17-010
  - id: smtp-relay
    script: smtp-open-relay
    pattern: "(?i)(open relay|Server is an open relay)"
    title: "SMTP open relay"
    template: smtp-relay
  - id: dns-recursion
    script: dns-recursion
    pattern: "(?i)(Recursion appears to be enabled|available)"
    title: "Open DNS resolver"
    template: open-resolver
  - id: dns-axfr
    script: dns-zone-transfer
    pattern: "(?i)(AXFR|records|SOA)"
    title: "DNS zone transfer"
    template: axfr
  - id: ntp-monlist
    script: ntp-monlist
    pattern: "(?i)(ntp-monlist|received)"
    title: "NTP monlist"
    template: ntp-monlist
  - id: nfs-exports
    script: nfs-showmount
    pattern: "."
    title: "NFS exports"
    template: nfs-export
  - id: redis-unauth
    script: redis-info
    pattern: "."
    title: "Redis unauthenticated"
    template: redis-unauth
  - id: mongo-unauth
    script: mongodb-databases
    pattern: "."
    title: "MongoDB unauthenticated"
    template: mongo-unauth
  - id: mssql-blank
    script: ms-sql-empty-password
    pattern: "(?i)(empty|sa )"
    title: "MSSQL blank sa password"
    template: blank-sa
  - id: mysql-blank
    script: mysql-empty-password
    pattern: "(?i)(empty|root)"
    title: "MySQL empty password"
    template: mysql-blank
  - id: ipmi-cipher0
    script: ipmi-cipher-zero
    pattern: "(?i)VULNERABLE"
    title: "IPMI cipher zero"
    template: ipmi-cipher-zero
  - id: rdp-ntlm
    script: rdp-ntlm-info
    pattern: "."
    title: "RDP NTLM information disclosure"
    template: rdp-exposed
  - id: ssh-weak
    script: ssh2-enum-algos
    pattern: "(?i)(ssh-rsa|3des|arcfour|diffie-hellman-group1|hmac-md5)"
    title: "Weak SSH algorithms"
    template: ssh-weak
  - id: snmp-users
    script: snmp-win32-users
    pattern: "."
    title: "SNMP leaked Windows users"
    template: snmp-public
  - id: x11
    script: x11-access
    pattern: "(?i)(X server access is granted|allowed)"
    title: "Open X11"
    template: x11-open
  - id: rsync
    script: rsync-list-modules
    pattern: "."
    title: "Rsync modules listed"
    template: rsync-open
  - id: heartbleed-out
    script: ssl-heartbleed
    pattern: "(?i)VULNERABLE"
    title: "Heartbleed"
    template: heartbleed
